name: Inspect AAudio ELF libraries

on:
  workflow_dispatch:
  push:
    paths:
      - "diagnostics/elfs/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find Android sdkmanager"
            exit 1
          fi

          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android NDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.2.12479018"

      - name: Find llvm-readelf
        run: |
          LLVM_READELF="$SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          if [ ! -x "$LLVM_READELF" ]; then
            echo "llvm-readelf was not found"
            exit 1
          fi

          echo "LLVM_READELF=$LLVM_READELF" >> "$GITHUB_ENV"

      - name: Inspect ELF libraries
        shell: bash
        run: |
          mkdir -p reports
          SYMBOL="AAudioStreamBuilder_setAllowedCapturePolicy"
          INPUT_DIR="diagnostics/elfs"
          FOUND=0

          {
            echo "AAudio ELF diagnostic report"
            echo "Target symbol: $SYMBOL"
            echo
          } > reports/summary.txt

          if [ ! -d "$INPUT_DIR" ]; then
            echo "No diagnostics/elfs directory exists." >> reports/summary.txt
          else
            while IFS= read -r -d '' FILE; do
              FOUND=1
              NAME="$(basename "$FILE")"
              SAFE_NAME="$(echo "$FILE" | sed 's#[^A-Za-z0-9._-]#_#g')"

              echo "Inspecting: $FILE"

              "$LLVM_READELF" --dyn-syms --wide "$FILE" \
                > "reports/${SAFE_NAME}.symbols.txt" 2>&1 || true

              "$LLVM_READELF" --relocations --wide "$FILE" \
                > "reports/${SAFE_NAME}.relocations.txt" 2>&1 || true

              if grep -Fq "$SYMBOL" "reports/${SAFE_NAME}.symbols.txt"; then
                echo "Symbol-table match: $FILE" >> reports/summary.txt
                grep -F "$SYMBOL" "reports/${SAFE_NAME}.symbols.txt" \
                  >> reports/summary.txt
              fi

              if grep -Fq "$SYMBOL" "reports/${SAFE_NAME}.relocations.txt"; then
                echo "Relocation match: $FILE" >> reports/summary.txt
                grep -F "$SYMBOL" "reports/${SAFE_NAME}.relocations.txt" \
                  >> reports/summary.txt
              fi

            done < <(find "$INPUT_DIR" -type f \( -name '*.so' -o -name '*.elf' \) -print0)
          fi

          if [ "$FOUND" -eq 0 ]; then
            echo "No .so or .elf input files were found." >> reports/summary.txt
            echo "Add the phone's library files under diagnostics/elfs/." >> reports/summary.txt
          fi

          cat reports/summary.txt

      - name: Upload diagnostic reports
        uses: actions/upload-artifact@v4
        with:
          name: aaudio-elf-diagnostic
          path: reports/
          if-no-files-found: error
