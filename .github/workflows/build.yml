name: Build Magisk module

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q aaudiocapturefix-github-project.zip -d /tmp/project
          cp -a /tmp/project/aaudiocapturefix/jni .
          cp -a /tmp/project/aaudiocapturefix/module .

      - name: Find Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          SDK_ROOT="${SDKMANAGER%%/cmdline-tools/*}"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install Android NDK
        shell: bash
        run: |
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install "ndk;27.2.12479018"

      - name: Download Zygisk header
        run: |
          git clone --depth 1 https://github.com/topjohnwu/zygisk-module-sample.git /tmp/zygisk
          cp /tmp/zygisk/module/jni/zygisk.hpp jni/zygisk.hpp

- name: Fix Zygisk hook registration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("jni/main.cpp")
          source = path.read_text()

          pattern = (
              r'(?ms)^([ \t]*)bool[ \t]+ok[ \t]*=[ \t]*'
              r'g_api->pltHookRegister[ \t]*\(.*?'
              r'^[ \t]*if[ \t]*\([ \t]*ok[ \t]*\)[ \t]*'
              r'\{.*?^[ \t]*\}'
          )

          replacement = (
              r'\1g_api->pltHookRegister(\n'
              r'\1    dev, ino, HOOK_SYMBOL,\n'
              r'\1    reinterpret_cast<void *>(hook_setAllowedCapturePolicy),\n'
              r'\1    reinterpret_cast<void **>(&g_orig));\n'
              r'\1registered_any = true;\n'
              r'\1LOGI("requested hook registration for %s", path);'
          )

          updated, count = re.subn(pattern, replacement, source, count=1)

          if count != 1:
              print("Could not locate the expected registration block.")
              for i, line in enumerate(source.splitlines(), 1):
                  if "pltHookRegister" in line or "bool ok" in line:
                      print(f"{i}: {line}")
              raise SystemExit(1)

          path.write_text(updated)
          print("Hook registration patch applied successfully.")
          PY

      - name: Compile native library
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk

      - name: Package Magisk module
        run: |
          mkdir -p module/zygisk
          cp libs/arm64-v8a/libaaudiocapturefix.so module/zygisk/arm64-v8a.so
          cd module
          zip -r ../aaudiocapturefix-magisk.zip .

      - name: Upload Magisk ZIP
        uses: actions/upload-artifact@v4
        with:
          name: aaudiocapturefix-magisk
          path: aaudiocapturefix-magisk.zip
          if-no-files-found: error
